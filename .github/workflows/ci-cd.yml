name: CI-CD Pipeline

on:
  push:
    branches: [main, dev] # Runs on push to main or dev
  pull_request:
    branches: [main, dev] # Runs on PRs to main or dev

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # This is the fix for the linting error
          node-version: '20' 
          cache: 'npm'
          # This is the fix for the EJSONPARSE error
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # This runs all commands inside the /frontend folder
        working-directory: ./frontend 
        run: npm ci # Use 'ci' for faster, more reliable installs in CI

      - name: Run linting
        working-directory: ./frontend
        # This is the fix for the weird path error
        run: npx next lint 

      - name: Run tests
        working-directory: ./frontend
        # This will now run your placeholder test script
        run: npm test 

      - name: Build application
        working-directory: ./frontend
        # This is the fix for the 'react-scripts' error
        run: npx next build 

      - name: Security audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to staging
        run: echo "Deploying to staging environment..."
        
      - name: Run integration tests
        run: echo "Running integration tests..."
        
      - name: Deploy to production
        run: echo "Deploying to production environment..."
