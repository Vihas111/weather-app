name: CI-CD Pipeline

on:
  push:
    branches: [main, dev] # Runs on push to main or dev
  pull_request:
    branches: [main, dev] # Runs on PRs targeting main or dev

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # This step now runs *inside* the /frontend folder
        working-directory: ./frontend
        run: npm ci # 'npm ci' is faster and safer for CI than 'npm install'

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npm test

      - name: Build application
        working-directory: ./frontend
        run: npm run build --if-present

      - name: Security audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 
    
    steps:
      - name: Deploy to staging
        run: echo "Deploying to staging environment..."
        
      - name: Run integration tests
        run: echo "Running integration tests..."
        
      - name: Deploy to production
        run: echo "Deploying to production environment..."
