name: Python CI Backend Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (backend)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # Install project deps (assumes backend/requirements.txt exists)
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Ensure test tools are available
          pip install uvicorn[standard] pytest requests

      - name: Create backend .env from secret
        working-directory: backend
        run: |
          # Use the pipeline secret name you have set in repo (WEATHER_API_KEY)
          echo "API_KEY=${{ secrets.WEATHER_API_KEY }}" > .env

      - name: Start backend (uvicorn) in background
        working-directory: backend
        run: |
          # start uvicorn in background and capture logs
          nohup python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          # wait until server responds on / (timeout ~30s)
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "Backend is up"
              break
            fi
            echo "Waiting for backend... ($i)"
            sleep 1
          done
          # show last server logs for debugging
          tail -n +1 uvicorn.log || true

      - name: Run backend tests
        working-directory: backend
        env:
          # ensure tests can access secrets if needed
          API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          pytest -q
